apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-media-pv
  labels:
    app.kubernetes.io/part-of: media-stack
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteMany
  # Retain, не Delete — здесь реальные медиафайлы, удаление PVC не должно их сносить.
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  mountOptions:
    - nfsvers=4.1
  nfs:
    server: 192.168.122.13
    path: /srv/nfs/media
