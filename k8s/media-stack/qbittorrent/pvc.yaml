apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config
  namespace: media
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/part-of: media-stack
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
# qbittorrent-downloads (local-path) удалён в Phase 3 — качает теперь в общий
# NFS-том nfs-media (см. k8s/media-stack/21-nfs-media-pvc.yaml), смонтированный в
# /data. Старый PVC нужно удалить руками после передеплоя:
# kubectl delete pvc -n media qbittorrent-downloads (см. docs/runbook-phase3.md).
