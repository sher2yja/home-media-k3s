apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/part-of: media-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
        app.kubernetes.io/part-of: media-stack
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker01
      initContainers:
        # Досевает WebUI\HostHeaderValidation=false и постоянный пароль ТОЛЬКО если
        # qBittorrent.conf ещё не существует (первый запуск на чистом PVC). Без
        # HostHeaderValidation=false WebUI по умолчанию отвечает "401 Unauthorized" на
        # любой Host, кроме localhost/127.0.0.1 — при доступе по IP это выглядит как
        # сломанный логин, хотя логин ни при чём. Без постоянного пароля qBittorrent
        # генерирует новый временный при КАЖДОМ старте контейнера — ломает любую
        # интеграцию (Sonarr/Radarr download client), где пароль сохранён заранее.
        # См. CLAUDE.md → Известные грабли.
        #
        # Хеш берётся из Secret qbittorrent-webui, а НЕ из этого файла: репозиторий
        # публичный и раздаётся релизами, иначе один пароль достался бы всем, кто
        # скачал. Создать Secret: infra/vms/scripts/08-qbittorrent-secret.sh
        # Логин: admin.
        - name: seed-webui-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              CONF=/config/qBittorrent/qBittorrent.conf
              if [ -f "$CONF" ]; then
                echo "qBittorrent.conf уже существует, не трогаю"
              else
                mkdir -p "$(dirname "$CONF")"
                printf '%s\n' \
                  '[BitTorrent]' \
                  'Session\DefaultSavePath=/data/downloads' \
                  '' \
                  '[Preferences]' \
                  'WebUI\Address=*' \
                  'WebUI\ServerDomains=*' \
                  'WebUI\HostHeaderValidation=false' \
                  'WebUI\Username=admin' \
                  "WebUI\\Password_PBKDF2=\"${QBT_PASSWORD_HASH}\"" \
                  > "$CONF"
                echo "qBittorrent.conf засеян путём для скачивания, дефолтами WebUI и паролем из Secret"
              fi
          env:
            - name: QBT_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-webui
                  key: password-pbkdf2
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Etc/UTC
            - name: WEBUI_PORT
              value: "8080"
          ports:
            - name: webui
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /config
            # Общий с sonarr/radarr/jellyfin NFS-том, у всех смонтирован в один и тот
            # же путь /data — это то, что позволяет Sonarr/Radarr делать hardlink
            # вместо copy при импорте (нужен тот же файловый том и тот же путь).
            # См. docs/architecture.md.
            - name: media
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: media
          persistentVolumeClaim:
            claimName: nfs-media
