apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: media
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/part-of: media-stack
spec:
  # NodePort, а не Ingress: 6 сервисов раздаются по своим портам
  # один-к-одному, разбирать HTTP некому. Ingress-контроллер тут был бы
  # слоем без функции — см. docs/shortcuts.md §3.
  type: NodePort
  selector:
    app.kubernetes.io/name: qbittorrent
  ports:
    - name: webui
      port: 8080
      targetPort: 8080
      nodePort: 30880
