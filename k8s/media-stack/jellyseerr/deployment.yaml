apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyseerr
  namespace: media
  labels:
    app.kubernetes.io/name: jellyseerr
    app.kubernetes.io/part-of: media-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyseerr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyseerr
        app.kubernetes.io/part-of: media-stack
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker01
      containers:
        - name: jellyseerr
          image: fallenbagel/jellyseerr:latest
          env:
            - name: TZ
              value: Etc/UTC
          ports:
            - name: http
              containerPort: 5055
          volumeMounts:
            - name: config
              mountPath: /app/config
          # Памяти больше, чем у соседей, по измеренной причине: сразу после
          # запуска Jellyseerr занимает 197Mi настоящей памяти при прежнем
          # пределе 256Mi. Оставшегося не хватает на то, что растёт от
          # пользования: ответы TMDB он держит В ПАМЯТИ с сроком 12 часов
          # (externalapi.js, node-cache), то есть чем больше человек листает,
          # тем ближе предел. 128Mi в запросе занижали и без того: столько он
          # не занимает никогда.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyseerr-config
