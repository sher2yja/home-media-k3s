apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: media
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/part-of: media-stack
spec:
  # NodePort, а не Ingress: 6 сервисов раздаются по своим портам
  # один-к-одному, разбирать HTTP некому. Ingress-контроллер тут был бы
  # слоем без функции — см. docs/shortcuts.md §3.
  type: NodePort
  selector:
    app.kubernetes.io/name: jellyfin
  ports:
    - name: http
      port: 8096
      targetPort: 8096
      nodePort: 30096
