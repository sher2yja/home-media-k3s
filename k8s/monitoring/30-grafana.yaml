# Grafana. Три сознательных упрощения:
#  1) Тома нет (emptyDir): datasource приезжает из ConfigMap, пользователей нет —
#     сохранять нечего. Дашборды импортируются по ID с grafana.com (см. runbook).
#  2) Анонимный вход с правами Admin — стенд за NAT, отдельные учётки тут лишние.
#  3) Service = NodePort 30300, как и у всех шести сервисов media: ingress-контроллера
#     в проекте нет намеренно (docs/shortcuts.md §3), порт раздаётся один-к-одному.
#     Тот же порт использует compose-форма — таблица портов одна на все формы
#     развёртывания, см. app/config.py.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: monitoring
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker01
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
            - name: data
              mountPath: /var/lib/grafana
          resources:
            requests:
              cpu: 50m
              memory: 150Mi
            limits:
              memory: 300Mi
      volumes:
        - name: datasource
          configMap:
            name: grafana-datasource
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30300
