# База мониторинга. Нужна не сама по себе, а чтобы на неё мог сослаться оверлей
# deploy/k3s/monitoring: kustomize пускает к чужому каталогу только через его
# собственный kustomization.yaml, а к отдельным файлам вне своего корня не
# пускает вовсе.
#
# Стенду это не мешает: он применяет эти манифесты поимённо, файл за файлом
# (порядок задан числовым префиксом, namespace идёт первым). Команда
# kubectl apply -f по КАТАЛОГУ после появления этого файла работать перестанет —
# она попыталась бы применить и его. Так и задумано: у каталога теперь есть
# правильный способ применения, kubectl apply -k.
resources:
  - 00-namespace.yaml
  - 10-prometheus.yaml
  - 20-node-exporter.yaml
  - 30-grafana.yaml
  - 40-dashboard.yaml
