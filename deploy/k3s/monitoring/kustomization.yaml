# k3s-форма мониторинга: оверлей над k8s/monitoring/, а не копия.
#
# Раньше мониторинг применялся напрямую (kubectl apply -f k8s/monitoring), а в
# соседнем kustomization.yaml стояло, что «на k3s он работает как есть». Это
# было неправдой, и проверено это было только сейчас: Prometheus и Grafana несут
# nodeSelector на k8s-worker01 — узел СТЕНДА. На машине пользователя такого узла
# нет, и оба пода вставали в Pending навсегда. Ошибки при этом никакой: apply
# отрабатывает успешно, поды просто никогда не запускаются.
#
# Ровно от этого медиастек защищён таким же патчем этажом выше. Мониторинг был
# обойдён — потому что применялся мимо kustomize.
#
# Ссылка на каталог, а не на файлы: к отдельным файлам вне своего корня kustomize
# не пускает вовсе («file is not in or below»), поэтому у базы появился свой
# kustomization.yaml. Стенду это ничего не сломало — он применяет те манифесты
# поимённо, а не каталогом.
resources:
  - ../../../k8s/monitoring

patches:
  # Единственное расхождение со стендом, и то же самое, что у медиастека: там
  # вся нагрузка прибита к worker01, потому что control-plane под taint'ом. У
  # пользователя нода одна и зовут её как его компьютер.
  #
  # DaemonSet здесь не при чём: node-exporter и так идёт на все узлы, поэтому
  # цель патча — только Deployment.
  - target:
      kind: Deployment
    patch: |
      - op: remove
        path: /spec/template/spec/nodeSelector
