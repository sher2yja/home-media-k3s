# Заявка на том с медиафайлами для k3s. На стенде это RWX-том по NFS с отдельной VM;
# здесь NFS нет, том берётся из папки, которую пользователь выбрал в окне установки.
# Сам том (PV) заявке готовит приложение по шаблону hostpath-volumes.yaml.tmpl —
# заранее его описать нельзя, путь известен только в момент установки.
#
# Имя PVC оставлено прежним — nfs-media — СПЕЦИАЛЬНО, хотя никакого NFS тут нет.
# Так его ждут все четыре деплоймента, и переименование стоило бы четырёх патчей
# ради косметики. Считать это именем тома «с медиатекой», а не указанием на NFS.
#
# ReadWriteOnce вместо ReadWriteMany: RWO ограничивает доступ одной НОДОЙ, а не одним
# подом. Нода здесь одна, все четыре пода монтируют том одновременно. Появится вторая
# нода — том придётся менять, иначе поды разъедутся по нодам и /data увидит не каждый.
#
# storageClassName проставляет патч в kustomization.yaml — пустым, чтобы заявку не
# перехватил local-path, который k3s несёт из коробки и делает классом по умолчанию.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-media
  namespace: media
  labels:
    app.kubernetes.io/part-of: media-stack
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
