# Один инвентарь на стенд. Машина пользователя (профиль продукта) появится
# отдельной группой в Phase 7 — там localhost и Compose/k3s вместо libvirt.
all:
  children:
    libvirt_host:
      hosts:
        localhost:
          ansible_connection: local

    cluster:
      children:
        control_plane:
          hosts:
            k8s-cp01:
              ansible_host: 192.168.122.11
        workers:
          hosts:
            k8s-worker01:
              ansible_host: 192.168.122.12
    storage:
      hosts:
        k8s-nfs01:
          ansible_host: 192.168.122.13

  vars:
    ansible_user: ubuntu
    ansible_ssh_common_args: '-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null'
