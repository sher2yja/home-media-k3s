# Один workflow, а не несколько файлов: проверки, сборка и релиз отличаются только
# условием запуска, а держать их вместе гарантирует, что релиз не соберётся из
# кода, который не прошёл проверки.
#
# Приложение собирается ТОЛЬКО здесь. Локальная сборка остаётся способом
# посмотреть, что получилось, но источник релиза — артефакты этого конвейера:
# иначе «у меня собиралось» однажды разойдётся с тем, что скачал человек.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Версия ruff закреплена намеренно: без этого его обновление добавляет новые
      # правила и роняет сборку на коде, который никто не трогал.
      - name: Установить инструменты
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.5 pyyaml

      - name: Синтаксис Python
        run: python -m compileall -q app

      - name: Линтер
        run: ruff check app

      # У приложения зависимостей нет вовсе, поэтому обе самопроверки запускаются
      # на голом Python — ставить перед ними нечего.
      - name: Самопроверка разбора статусов
        run: cd app && python media.py

      - name: Самопроверка путей и шаблона томов
        run: cd app && python install.py

      - name: Самопроверка иконки
        run: cd app && python icon.py

      - name: Самопроверка связывания сервисов
        run: cd app && python wire.py

      - name: Самопроверка инструкций по сервисам
        run: cd app && python guides.py

      - name: Синтаксис YAML
        run: |
          python - <<'PY'
          import pathlib, sys, yaml
          bad = 0
          files = (list(pathlib.Path('k8s').rglob('*.yaml'))
                   + list(pathlib.Path('deploy').rglob('*.yaml'))
                   + list(pathlib.Path('ansible').rglob('*.yml')))
          for p in files:
              try:
                  # Многодокументные манифесты требуют safe_load_all, а не safe_load.
                  list(yaml.safe_load_all(p.read_text()))
              except yaml.YAMLError as e:
                  print(f'{p}: {e}'); bad += 1
          print(f'проверено файлов: {len(files)}')
          sys.exit(bad)
          PY

      # Шаблон томов сам по себе не YAML (в нём плейсхолдеры), поэтому проверяется
      # заполненным. Здесь же ловится лишняя фигурная скобка в комментарии: она
      # сломала бы format() уже на машине пользователя.
      - name: Шаблон томов разворачивается в валидный YAML
        run: |
          python - <<'PY'
          import pathlib, sys, yaml
          sys.path.insert(0, 'app')
          import install
          docs = list(yaml.safe_load_all(
              install.render_volumes(pathlib.Path('/tmp/cfg'), pathlib.Path('/tmp/media'))))
          docs = [d for d in docs if d]
          assert len(docs) == 7, f'томов должно быть 7, а вышло {len(docs)}'
          assert {d['spec']['claimRef']['name'] for d in docs} == {
              'nfs-media', 'jellyfin-config', 'jellyseerr-config', 'sonarr-config',
              'radarr-config', 'prowlarr-config', 'qbittorrent-config'}
          print('шаблон томов: 7 томов, заявки на месте')
          PY

      - name: Синтаксис bash
        run: |
          for f in infra/vms/scripts/*.sh; do bash -n "$f"; done
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck infra/vms/scripts/*.sh

      # kustomize встроен в kubectl; проверяем, что оверлей k3s собирается и что из
      # него не просочился nodeSelector стенда — с ним поды у пользователя повисли бы
      # в Pending навсегда.
      - name: Оверлей k3s собирается
        run: |
          curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          ./kubectl kustomize deploy/k3s > /tmp/k3s.yaml
          # 22 = namespace + 7 сервисов (deployment+service) + 7 заявок.
          # FlareSolverr без PVC: ему нечего хранить между запусками.
          test "$(grep -c '^kind:' /tmp/k3s.yaml)" -eq 22
          ! grep -q nodeSelector /tmp/k3s.yaml
          ! grep -q 'storageClassName: nfs' /tmp/k3s.yaml
          # Ни одной заявки на local-path: тома статические, их готовит установщик.
          # Пропусти это — и данные тихо уедут в /var/lib/rancher вместо папки,
          # которую выбрал пользователь.
          ! grep -q 'storageClassName: local-path' /tmp/k3s.yaml
          test "$(grep -c 'storageClassName: ""' /tmp/k3s.yaml)" -eq 7

      # Главный риск проекта: формы развёртывания расходятся, и адрес сервиса у
      # пользователя перестаёт совпадать с документацией и текстами приложения.
      # Эта проверка — единственное, что этому мешает. Не удаляй её.
      - name: Порты k3s совпадают с app/config.py
        run: |
          python - <<'PY'
          import subprocess, sys, yaml
          sys.path.insert(0, 'app')
          import config

          want = {s.port: s.internal_port for s in config.SERVICES}
          rendered = subprocess.run(['./kubectl', 'kustomize', 'deploy/k3s'],
                                    capture_output=True, text=True, check=True).stdout
          # 'nodePort' in p — не перестраховка: FlareSolverr раздаётся как
          # ClusterIP, наружу не смотрит и в таблице портов ему делать нечего.
          # Без этого условия проверка падала бы на KeyError, а выглядело бы это
          # как расхождение портов.
          k3s = {p['nodePort']: p['targetPort']
                 for d in yaml.safe_load_all(rendered) if d and d['kind'] == 'Service'
                 for p in d['spec']['ports'] if 'nodePort' in p}
          assert k3s == want, f'k3s разошёлся: {k3s} != {want}'
          print('порты k3s совпадают с app/config.py')

          # Порт FlareSolverr в таблицу выше не входит, но разъехаться может так же:
          # его знают манифест и wire.py, а сверять их больше нечему.
          fs = [d for d in yaml.safe_load_all(rendered)
                if d and d['kind'] == 'Service' and d['metadata']['name'] == 'flaresolverr']
          assert len(fs) == 1, 'сервиса flaresolverr нет в оверлее'
          assert fs[0]['spec']['type'] == 'ClusterIP', 'FlareSolverr не должен смотреть наружу'
          assert fs[0]['spec']['ports'][0]['port'] == config.FLARESOLVERR_PORT, (
              f"порт FlareSolverr разошёлся с app/config.py: "
              f"{fs[0]['spec']['ports'][0]['port']} != {config.FLARESOLVERR_PORT}")
          print(f'FlareSolverr: ClusterIP на {config.FLARESOLVERR_PORT}, как в app/config.py')

          # Grafana в оверлей не входит — она в k8s/monitoring и только в полном
          # профиле, — но её порт записан в двух местах ровно так же. Пока это
          # никем не сверялось, разойтись было нечему помешать.
          monitoring = yaml.safe_load_all(
              open('k8s/monitoring/30-grafana.yaml').read())
          svc = [d for d in monitoring
                 if d and d['kind'] == 'Service' and d['metadata']['name'] == 'grafana']
          assert len(svc) == 1, 'сервиса grafana нет в k8s/monitoring'
          port = svc[0]['spec']['ports'][0]
          assert port['nodePort'] == config.GRAFANA.port, (
              f"порт Grafana разошёлся с app/config.py: "
              f"{port['nodePort']} != {config.GRAFANA.port}")
          assert port['port'] == config.GRAFANA.internal_port, (
              f"внутренний порт Grafana разошёлся: "
              f"{port['port']} != {config.GRAFANA.internal_port}")
          print(f'Grafana: {config.GRAFANA.port} -> {config.GRAFANA.internal_port}, '
                'как в app/config.py')

          # UID дашборда записан и в манифесте, и в config — из него собирается
          # адрес кнопки. Разойдутся — Grafana ответит страницей «Dashboard not
          # found», то есть кнопка будет выглядеть рабочей и вести в никуда.
          import json
          docs = [d for d in yaml.safe_load_all(
              open('k8s/monitoring/40-dashboard.yaml').read()) if d]
          cm = [d for d in docs if d['metadata']['name'] == 'grafana-dashboards'][0]
          dash = json.loads(cm['data']['home-media.json'])
          assert dash['uid'] == config.GRAFANA_DASHBOARD_UID, (
              f"UID дашборда разошёлся: {dash['uid']} != "
              f"{config.GRAFANA_DASHBOARD_UID}")
          assert config.GRAFANA_DASHBOARD_UID in config.grafana_dashboard_url()
          assert dash['panels'], 'в дашборде нет ни одной панели'
          # Пустой datasource у панели — та же беда: график молча не рисуется.
          for panel in dash['panels']:
              uid = panel.get('datasource', {}).get('uid')
              assert uid == 'prometheus', f"{panel['title']}: datasource {uid!r}"
          print(f"дашборд {dash['uid']}: панелей {len(dash['panels'])}, "
                'все на datasource prometheus')

          # Состав оверлея мониторинга должен покрывать всю базу: файл, забытый в
          # kustomization, просто не поедет к пользователю, и молча.
          import pathlib
          base = pathlib.Path('k8s/monitoring')
          listed = set(yaml.safe_load(
              (base / 'kustomization.yaml').read_text())['resources'])
          on_disk = {f.name for f in base.glob('*.yaml')} - {'kustomization.yaml'}
          assert listed == on_disk, (
              f'k8s/monitoring/kustomization.yaml разошёлся с каталогом: '
              f'{on_disk - listed} не перечислены, {listed - on_disk} лишние')
          print(f'мониторинг: все {len(on_disk)} манифестов перечислены')
          PY

      # e2e ставит k3s сам через curl, поэтому скачивание установщика ИЗ
      # ПРИЛОЖЕНИЯ там не выполняется ни разу. Именно оно и сломалось: urllib
      # представляется как Python-urllib, а CDN за get.k3s.io отвечает на это 403,
      # и установка падала у каждого пользователя Linux на первом же шаге.
      - name: Установщик k3s реально скачивается
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'app')
          import install

          data = install.fetch_installer()
          assert data.startswith(b'#!/bin/sh'), f'это не скрипт: {data[:40]!r}'
          assert b'INSTALL_K3S_EXEC' in data, 'в скрипте нет INSTALL_K3S_EXEC'
          print(f'{install.K3S_INSTALL_URL} отдал {len(data)} байт скрипта')
          PY

      # Тот же риск расхождения, что и с портами, только про права: install.py
      # правит PUID у поимённого списка развёртываний. Добавится седьмой сервис на
      # образе linuxserver.io — он молча останется с PUID=1000 из манифеста и не
      # сможет писать в папку человека. Пусть лучше упадёт здесь.
      - name: Список развёртываний с PUID совпадает с манифестами
        run: |
          python - <<'PY'
          import pathlib, sys, yaml
          sys.path.insert(0, 'app')
          import install

          in_manifests = set()
          for path in pathlib.Path('k8s/media-stack').glob('*/deployment.yaml'):
              doc = yaml.safe_load(path.read_text(encoding='utf-8'))
              env = doc['spec']['template']['spec']['containers'][0].get('env') or []
              if any(v['name'] == 'PUID' for v in env):
                  in_manifests.add(doc['metadata']['name'])
          assert in_manifests == set(install.LSIO_DEPLOYMENTS), (
              f'разошлось: манифесты {sorted(in_manifests)}, '
              f'install.py {sorted(install.LSIO_DEPLOYMENTS)}')
          print(f'PUID правится у {len(in_manifests)} развёртываний — как в манифестах')
          PY

      # Тот же риск расхождения, третий раз: куда торрент складывает скачанное.
      # /data/downloads обязан лежать на ОДНОМ томе с /data/library, иначе жёсткая
      # ссылка невозможна, *arr на импорте копируют, и каждый фильм занимает место
      # дважды — молча. Путь живёт в двух местах: в засеваемом конфиге торрента и в
      # app/config.py. Разъедутся — сломается ровно то, ради чего тома общие.
      - name: Путь для скачивания в манифесте совпадает с app/config.py
        run: |
          python - <<'PY'
          import pathlib, sys, yaml
          sys.path.insert(0, 'app')
          import config

          doc = yaml.safe_load(pathlib.Path(
              'k8s/media-stack/qbittorrent/deployment.yaml').read_text())
          seed = ' '.join(doc['spec']['template']['spec']['initContainers'][0]['command'])
          want = f'Session\\DefaultSavePath={config.DOWNLOADS_DIR}'
          assert want in seed, f'в засеваемом конфиге торрента нет {want!r}'
          print(f'торрент засевается с {want}')
          PY

      # Головы у раннера нет, поэтому окно собирается в виртуальном X-сервере.
      # Одной проверки «окно построилось» мало: она пропускает целый класс
      # ошибок — обращение к Tk из фонового потока. Поэтому цикл крутится, пока
      # предпроверки реально не отрисуются, и результат читается из виджетов.
      - name: Окно приложения собирается и предпроверки отрисовываются
        run: |
          sudo apt-get install -y -qq xvfb
          xvfb-run -a python - <<'PY'
          import sys, time
          sys.path.insert(0, 'app')
          import ui

          app = ui.App()
          deadline = time.time() + 30
          while time.time() < deadline:
              app.update()
              if not app._busy and app.checks_frame.winfo_children():
                  break
              time.sleep(0.1)

          assert app.notebook.index('end') == 4, 'вкладок должно быть четыре'

          # Подвкладка на каждый сервис плюс «Все сервисы». Разъезжается это
          # молча: guides.ORDER задаёт состав, а окно строит подвкладки по нему,
          # и сервис, добавленный в config без инструкции, тут и всплывёт.
          import config, guides
          names = [app.server_tabs.tab(i, 'text')
                   for i in range(app.server_tabs.index('end'))]
          assert names[0] == 'Все сервисы', names
          assert names[1:] == [config.BY_KEY[k].title for k in guides.ORDER], names
          for key, widget in app.guide_texts.items():
              assert widget.get('1.0', 'end').strip(), f'{key}: инструкция пустая'
          print('подвкладок', len(names), '—', ', '.join(names))

          def texts(w):
              for ch in w.winfo_children():
                  try:
                      if ch.cget('text'):
                          yield ch.cget('text')
                  except Exception:
                      pass
                  yield from texts(ch)

          rendered = list(texts(app.checks_frame))
          assert rendered, 'предпроверки не отрисовались'
          broken = [t for t in rendered if 'Не удалось проверить' in t]
          assert not broken, broken
          assert any('Проверяю' not in t for t in rendered), 'проверки не завершились'
          print('окно собирается, вкладок 4, предпроверок отрисовано:',
                sum(1 for t in rendered if t in ('✓', '✕')))
          app.destroy()
          PY

  # Первая в проекте проверка продукта целиком: настоящий k3s, настоящие образы,
  # настоящие ответы сервисов. До неё «работает» означало «работало на машине автора».
  e2e:
    needs: check
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Ставим k3s заранее сами: внутри приложения это делает pkexec, а на раннере
      # некому нажать «разрешить». Всё остальное дальше делает сам установщик.
      - name: Поставить k3s
        run: |
          curl -sfL https://get.k3s.io | \
            sudo INSTALL_K3S_EXEC="--write-kubeconfig-mode 0644" sh -

      - name: Установка тем же кодом, что у пользователя
        run: |
          python - <<'PY'
          import pathlib, sys
          sys.path.insert(0, 'app')
          import install
          home = pathlib.Path.home()
          result = install.install('simple', home / 'hm-config', home / 'hm-media',
                                   on_line=print)
          assert result['ok'], 'установка вернула ok=False'
          assert result['qbittorrent_password'], 'пароль торрента не создан'
          PY

      # install.install() уже дождался связывания и упал бы, если бы его не было.
      # Здесь только показываем результат: какая заявка на каком томе оказалась.
      - name: Тома связались с заявками
        run: |
          sudo k3s kubectl get pvc,pv -n media
          test "$(sudo k3s kubectl get pvc -n media -o jsonpath='{.items[*].status.phase}' | tr ' ' '\n' | grep -c Bound)" -eq 7

      - name: Поды поднялись
        run: |
          sudo k3s kubectl wait --for=condition=Ready pod --all -n media --timeout=900s
          sudo k3s kubectl get pods -n media

      # Опрашиваем сервисы тем же кодом, которым это делает окно приложения:
      # проверяем продукт, а не отдельную выдумку для CI.
      - name: Все шесть сервисов отвечают
        run: |
          python - <<'PY'
          import sys, time
          sys.path.insert(0, 'app')
          import media
          for attempt in range(10):          # сервисам нужно время на первый старт
              statuses = media.service_status()
              if all(s['alive'] for s in statuses):
                  break
              time.sleep(15)
          for s in statuses:
              print(f"{s['title']}: {s['text']}")
          assert all(s['alive'] for s in statuses), 'не все сервисы отвечают'
          PY

      # Единственное место, где API Sonarr, Radarr и Prowlarr проверяются
      # по-настоящему: подделывать их ответы бессмысленно — разъедется как раз то,
      # что подделано. install.install() уже вызвал wire.configure(); здесь
      # проверяем, что связки действительно легли в конфиги сервисов.
      - name: Сервисы связаны между собой
        run: |
          python - <<'PY'
          import pathlib, sys, time
          sys.path.insert(0, 'app')
          import config, media, wire

          config_dir = pathlib.Path.home() / 'hm-config'
          steps = wire.configure(config_dir, on_line=print)
          failed = [s for s in steps if not s.ok]
          assert not failed, f'не связалось: {failed}'

          # Проверяем не свой возврат, а состояние сервисов: спрашиваем у них.
          for svc, folder in config.ROOT_FOLDERS.items():
              key = media.arr_api_key(config_dir, svc)
              _, clients, _ = wire._api(svc, key, '/api/v3/downloadclient')
              assert any(c['name'] == 'qBittorrent' for c in clients), f'{svc}: торрента нет'
              _, roots, _ = wire._api(svc, key, '/api/v3/rootfolder')
              mine = [r for r in roots if r['path'].rstrip('/') == folder]
              assert mine, f'{svc}: нет {folder}'
              # accessible — ответ самого сервиса на вопрос «я туда могу писать?».
              # Именно он и был False, когда PUID не совпадал с хозяином папки.
              assert mine[0].get('accessible'), f'{svc}: {folder} недоступна изнутри'
              _, mm, _ = wire._api(svc, key, '/api/v3/config/mediamanagement')
              assert mm['copyUsingHardlinks'], f'{svc}: hardlink не включён'
              print(f'{svc}: торрент, папка {folder}, hardlink — на месте')

          prowlarr = media.arr_api_key(config_dir, 'prowlarr')
          _, apps, _ = wire._api('prowlarr', prowlarr, '/api/v1/applications')
          names = {a['name'] for a in apps or []}
          assert {'sonarr', 'radarr'} <= names, f'Prowlarr знает только про {names}'
          print('Prowlarr связан с Sonarr и Radarr')

          # Повторный вызов не должен ничего задвоить: кнопку нажмут дважды.
          wire.configure(config_dir)
          _, clients, _ = wire._api('sonarr', media.arr_api_key(config_dir, 'sonarr'),
                                    '/api/v3/downloadclient')
          assert len(clients) == 1, f'торрент задвоился: {len(clients)}'
          print('повторный вызов ничего не задвоил')
          PY

      # Обход Cloudflare разъезжается молча: прокси остаётся на месте и выглядит
      # настроенным, а метки нет — и он не применяется ни к одному индексеру.
      # Ровно так и случилось у первого живого пользователя. Проверяем оба
      # конца метки, потому что нужны оба: и на прокси, и на индексере.
      - name: Обход Cloudflare чинится сам
        run: |
          python - <<'PY'
          import json, pathlib, sys, urllib.request
          sys.path.insert(0, 'app')
          import config, media, wire

          config_dir = pathlib.Path.home() / 'hm-config'
          key = media.arr_api_key(config_dir, 'prowlarr')

          def proxy():
              _, items, _ = wire._api('prowlarr', key, '/api/v1/indexerproxy')
              found = [p for p in items or [] if p['implementation'] == 'FlareSolverr']
              assert len(found) == 1, f'прокси должен быть один, а их {len(found)}'
              return found[0]

          # 1. Снимаем метку — так выглядит установка, сделанная до исправления.
          broken = proxy()
          broken['tags'] = []
          code, _, reason = wire._api('prowlarr', key,
                                      f"/api/v1/indexerproxy/{broken['id']}",
                                      data=broken, method='PUT')
          assert code in (200, 201, 202), f'не снялась метка: {code} {reason}'
          assert proxy()['tags'] == [], 'метка не снялась'

          step = wire.add_flaresolverr(key)
          assert step.ok, f'починка не прошла: {step.detail}'
          assert proxy()['tags'], 'метка не вернулась: прокси снова ни к чему не применяется'
          print(f'прокси: {step.detail}')

          # 2. Индексер человек добавляет сам и уже после установки. Заглушка на
          # Torznab с недоступным адресом заводится мгновенно и в сеть не ходит:
          # проверяем метку, а не работу трекера.
          _, profiles, _ = wire._api('prowlarr', key, '/api/v1/appprofile')
          assert profiles, 'Prowlarr не отдал профили приложений'

          # Схему тянем в обход wire._api: она весит 5.7 МБ и приходит за пять
          # секунд, ровно в media.TIMEOUT. Приложению столько ждать незачем и
          # оно этот запрос не делает — а проверке нужен запас, иначе она падает
          # не на том, что проверяет.
          url = (config.service_url(config.BY_KEY['prowlarr'])
                 + '/api/v1/indexer/schema')
          request = urllib.request.Request(url, headers={'X-Api-Key': key})
          with urllib.request.urlopen(request, timeout=120) as answer:
              schema = json.load(answer)
          assert schema, 'Prowlarr не отдал схему индексеров'
          entry = [s for s in schema if s['implementation'] == 'Torznab'][0]
          entry.update(name='проба-меток', enable=False, tags=[],
                       appProfileId=profiles[0]['id'])
          wire._set_field(entry, 'baseUrl', 'http://127.0.0.1:1')
          code, made, reason = wire._api('prowlarr', key,
                                         '/api/v1/indexer?forceSave=true', data=entry)
          assert code in (200, 201), f'заглушка не завелась: {code} {reason}'
          assert made['tags'] == [], 'заглушка почему-то уже помечена'

          step = wire.tag_indexers(key)
          assert step.ok, f'метки не поставились: {step.detail}'
          _, indexers, _ = wire._api('prowlarr', key, '/api/v1/indexer')
          mine = [i for i in indexers if i['id'] == made['id']][0]
          assert mine['tags'], 'индексер остался без метки — пойдёт мимо обхода'
          print(f'индексеры: {step.detail}')

          again = wire.tag_indexers(key)
          assert again.ok and 'уже помечены' in again.detail, (
              f'повторный вызов повёл себя иначе: {again.detail}')
          print(f'повторный вызов: {again.detail}')

          wire._api('prowlarr', key, f"/api/v1/indexer/{made['id']}", method='DELETE')
          PY

      # Права на папку — то, из-за чего связывание падало с 400 без объяснения.
      # Раннер работает под uid 1001, в манифестах стоит 1000, и без apply_identity
      # контейнер не может писать в папку человека. Спрашиваем у самого сервиса.
      - name: PUID подставлен по хозяину папок
        run: |
          echo "uid раннера: $(id -u), gid: $(id -g)"
          for d in jellyfin prowlarr qbittorrent radarr sonarr; do
            sudo k3s kubectl get deployment "$d" -n media \
              -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="PUID")].value}{"\n"}' \
              | grep -qx "$(id -u)" || { echo "PUID у $d не совпал с раннером"; exit 1; }
          done
          echo "все пять развёртываний пишут от имени $(id -u)"

      - name: Что было в логах, если упало
        if: failure()
        run: |
          sudo k3s kubectl get pods,pvc,pv -n media
          sudo k3s kubectl describe pods -n media | tail -100

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать бандл
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.22.2
          pyinstaller --clean --noconfirm home-media-k3s.spec

      # Один файл: человек скачивает и запускает. Манифесты уже внутри бандла,
      # отдельно их качать не нужно.
      - name: Переименовать
        run: mv dist/home-media-k3s dist/home-media-k3s-linux

      - uses: actions/upload-artifact@v4
        with:
          name: home-media-k3s-linux
          path: dist/home-media-k3s-linux
          if-no-files-found: error

  release:
    needs: [check, e2e, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Право на запись выдано ТОЛЬКО этой задаче, а не всему workflow. Новым
    # репозиториям GITHUB_TOKEN выдаётся на чтение, и без этой строки создание
    # релиза падает с 403 "Resource not accessible by integration" — при том что
    # артефакты скачиваются нормально, и выглядит это как ошибка выкладки.
    permissions:
      contents: write
    steps:
      # Пересборки здесь нет специально: выкладывается ровно то, что прошло
      # проверки и e2e, а не собранное заново из тех же исходников.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # Список изменений GitHub соберёт сам по коммитам между тегами. Руками
          # он в каждом релизе разъедется с тем, что на самом деле поменялось.
          generate_release_notes: true
          body: |
            Скачайте файл и запустите — откроется окно установки. Нужен Linux
            с systemd, всё остальное программа поставит сама.

            Версии для Windows пока нет: путь через WSL2 был написан по
            документации и ни разу не проверялся на живой машине, поэтому снят.
            Он вернётся отдельным релизом.
